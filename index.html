<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEO Title & Meta Description Optimizer</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f3;
      padding: 30px;
      color: #1a1a1a;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #ddd;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    textarea {
      min-height: 80px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: black;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #ddd;
      margin-bottom: 15px;
    }

    .title {
      color: blue;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .meta {
      color: #555;
      margin-bottom: 8px;
    }

    .score {
      font-weight: bold;
      color: green;
    }

    .error-box {
      background: #ffe5e5;
      color: red;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>SEO Title & Meta Optimizer</h1>
  <p class="subtitle">Generate 5 click-worthy title tags and meta descriptions</p>

  <div class="card">
    <label>Target Keyword</label>
    <input type="text" id="keyword" placeholder="e.g. advance auto">

    <label>Page Type</label>
    <select id="pagetype">
      <option value="blog">Blog</option>
      <option value="service">Service</option>
      <option value="product">Product</option>
      <option value="local">Local SEO</option>
    </select>

    <label>Current Title</label>
    <input type="text" id="title" placeholder="Optional">

    <label>Current Meta Description</label>
    <textarea id="desc" placeholder="Optional"></textarea>

    <label>USP / Offer</label>
    <input type="text" id="usp" placeholder="Optional">

    <button id="runBtn" onclick="runOptimizer()">
      Generate 5 Optimized Variations
    </button>
  </div>

  <div id="output"></div>
</div>

<script>
async function runOptimizer() {
  const keyword = document.getElementById("keyword").value.trim();
  const title = document.getElementById("title").value.trim();
  const desc = document.getElementById("desc").value.trim();
  const usp = document.getElementById("usp").value.trim();
  const pagetype = document.getElementById("pagetype").value;
  const btn = document.getElementById("runBtn");

  if (!keyword) {
    alert("Please enter a target keyword");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Generating...";

  document.getElementById("output").innerHTML =
    '<div class="loading">Generating SEO suggestions...</div>';

  const prompt = `
Generate 5 SEO optimized title tags and meta descriptions.

Keyword: ${keyword}
Page Type: ${pagetype}
Current Title: ${title || "none"}
Current Meta: ${desc || "none"}
USP: ${usp || "none"}

Return ONLY valid JSON in this format:

{
  "variations": [
    {
      "strategy": "",
      "title": "",
      "meta": "",
      "ctr_score": 85,
      "notes": ""
    }
  ]
}
`;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        contents: [
          {
            parts: [
              {
                text: prompt
              }
            ]
          }
        ]
      })
    });

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(`API Error ${response.status}: ${errorText}`);
    }

    const data = await response.json();

    console.log("Gemini Response:", data);

    const rawResponse =
      data.candidates?.[0]?.content?.parts?.[0]?.text;

    if (!rawResponse) {
      throw new Error("No response received from Gemini API");
    }

    const cleanResponse = rawResponse
      .replace(/```json/g, "")
      .replace(/```/g, "")
      .trim();

    const parsed = JSON.parse(cleanResponse);

    let html = "";

    parsed.variations.forEach((item, index) => {
      html += `
        <div class="result-card">
          <h3>${index + 1}. ${item.strategy}</h3>
          <div class="title">${item.title}</div>
          <div class="meta">${item.meta}</div>
          <div class="score">CTR Score: ${item.ctr_score}/100</div>
          <p>${item.notes}</p>
        </div>
      `;
    });

    document.getElementById("output").innerHTML = html;

  } catch (error) {
    document.getElementById("output").innerHTML = `
      <div class="error-box">
        Error: ${error.message}
      </div>
    `;
  } finally {
    btn.disabled = false;
    btn.innerText = "Generate 5 Optimized Variations";
  }
}
</script>

</body>
</html>
