<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEO Title & Meta Description Optimizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 1.5rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0dc;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #1a1a1a;
    }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .full { margin-bottom: 12px; }

    label {
      font-size: 13px;
      color: #555;
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    input, textarea, select {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      color: #1a1a1a;
      background: #fafaf9;
      border: 1px solid #d0d0cc;
      border-radius: 8px;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #333;
    }

    textarea { min-height: 75px; resize: vertical; }

    button.run {
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
      transition: opacity 0.15s;
    }

    button.run:hover { opacity: 0.85; }
    button.run:disabled { opacity: 0.45; cursor: not-allowed; }

    .result-card {
      background: #fff;
      border: 1px solid #e0e0dc;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 10px;
    }

    .result-card.best { border: 2px solid #185FA5; }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .badge-best { background: #E6F1FB; color: #185FA5; }
    .badge-good { background: #EAF3DE; color: #3B6D11; }
    .badge-ok  { background: #FAEEDA; color: #854F0B; }

    .strategy-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .serp-title { font-size: 18px; color: #1a0dab; margin-bottom: 2px; line-height: 1.3; word-break: break-word; }
    .serp-url   { font-size: 13px; color: #006621; margin-bottom: 4px; }
    .serp-desc  { font-size: 14px; color: #4d5156; line-height: 1.58; }

    .meter { height: 4px; border-radius: 2px; background: #eee; margin-top: 10px; overflow: hidden; }
    .meter-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

    .score-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

    .pill {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #d0d0cc;
      color: #666;
    }

    .pill.ok   { color: #3B6D11; border-color: #97C459; }
    .pill.warn { color: #854F0B; border-color: #EF9F27; }
    .pill.bad  { color: #993C1D; border-color: #D85A30; }

    .note { font-size: 12px; color: #777; margin-top: 8px; line-height: 1.6; }

    .loading { text-align: center; padding: 2rem; color: #888; font-size: 14px; }

    .error-box {
      background: #fff0f0;
      border: 1px solid #f0b0b0;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: #a32d2d;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .results-heading {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 10px;
    }

    @media (max-width: 540px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SEO Title & Meta Optimizer</h1>
    <p class="subtitle">Generate 5 click-worthy title tags and meta descriptions for any page</p>

    <div class="card">
      <div class="card-title">Page info</div>
      <div class="row">
        <div>
          <label>Target keyword</label>
          <input type="text" id="keyword" placeholder="e.g. best hotels in Kashmir" />
        </div>
        <div>
          <label>Page type</label>
          <select id="pagetype">
            <option value="blog">Blog / article</option>
            <option value="service">Service page</option>
            <option value="product">Product / package</option>
            <option value="local">Local SEO page</option>
            <option value="category">Category page</option>
          </select>
        </div>
      </div>
      <div class="full">
        <label>Current title tag <span style="font-weight:400;color:#999;">(or leave blank)</span></label>
        <input type="text" id="title" placeholder="e.g. Kashmir Hotels | Book Now" />
      </div>
      <div class="full">
        <label>Current meta description <span style="font-weight:400;color:#999;">(or leave blank)</span></label>
        <textarea id="desc" placeholder="e.g. Find the best hotels in Kashmir..."></textarea>
      </div>
      <div class="full">
        <label>USP / main offer <span style="font-weight:400;color:#999;">(optional)</span></label>
        <input type="text" id="usp" placeholder="e.g. 3-night packages from ₹4999, free pickup" />
      </div>
      <button class="run" id="runBtn" onclick="runOptimizer()">Generate 5 optimized variations →</button>
    </div>

    <div id="output"></div>
  </div>

  <script>
    function charPill(len, min, max) {
      let cls = 'ok', label = 'good';
      if (len < min) { cls = 'warn'; label = 'short'; }
      if (len > max) { cls = 'bad'; label = 'long'; }
      return `<span class="pill ${cls}">${len} chars — ${label}</span>`;
    }

    function meterColor(score) {
      if (score >= 80) return '#1D9E75';
      if (score >= 60) return '#BA7517';
      return '#D85A30';
    }

    function badge(i, score) {
      if (i === 0) return '<span class="badge badge-best">highest CTR potential</span>';
      if (score >= 75) return '<span class="badge badge-good">strong</span>';
      return '<span class="badge badge-ok">alternative</span>';
    }

    async function runOptimizer() {
      const keyword = document.getElementById('keyword').value.trim();
      if (!keyword) { alert('Please enter a target keyword first.'); return; }

      const title    = document.getElementById('title').value.trim();
      const desc     = document.getElementById('desc').value.trim();
      const usp      = document.getElementById('usp').value.trim();
      const pagetype = document.getElementById('pagetype').value;
      const btn      = document.getElementById('runBtn');

      btn.disabled = true;
      btn.textContent = 'Generating...';
      document.getElementById('output').innerHTML = '<div class="loading">Crafting 5 variations — this takes a few seconds...</div>';

      const prompt = `You are an expert SEO specialist. Generate 5 optimized title tag + meta description combos.

Target keyword: "${keyword}"
Page type: ${pagetype}
Current title: "${title || 'none provided'}"
Current meta: "${desc || 'none provided'}"
USP/offer: "${usp || 'none provided'}"

Each variation must use a different strategy: keyword-first, curiosity, number/stat, urgency, question format.

Respond ONLY with raw JSON — no markdown, no explanation. Structure:
{"variations":[{"strategy":"keyword-first","title":"...","meta":"...","ctr_score":82,"notes":"..."},{"strategy":"curiosity","title":"...","meta":"...","ctr_score":78,"notes":"..."},{"strategy":"number/stat","title":"...","meta":"...","ctr_score":75,"notes":"..."},{"strategy":"urgency","title":"...","meta":"...","ctr_score":71,"notes":"..."},{"strategy":"question","title":"...","meta":"...","ctr_score":68,"notes":"..."}]}

Rules: titles 50-60 chars, metas 145-160 chars, include keyword naturally, sort by ctr_score descending.`;

      try {
        const res = await fetch("/api/chat", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    contents: [
      {
        parts: [
          {
            text: prompt
          }
        ]
      }
    ]
  })
});

if (!res.ok) {
  const errText = await res.text();
  throw new Error(`API ${res.status}: ${errText}`);
}

const data = await res.json();

console.log(data);

if (data.error) {
  throw new Error(JSON.stringify(data.error));
}

// Gemini response parsing
const raw =
  data.candidates?.[0]?.content?.parts?.[0]?.text;

if (!raw) {
  throw new Error("No response returned from Gemini");
}

const clean = raw.replace(/```json|```/g, '').trim();
const parsed = JSON.parse(clean);
      }
    }
  </script>
</body>
</html>
